version: "2"

run:
  # Analyze with the oddk_debug tag so the debug-only daemon files and the e2e
  # harness (which references DebugSetRawKV) type-check. Production builds omit
  # the tag; the trivial !oddk_debug stub is the only thing not linted here.
  build-tags:
    - oddk_debug
  issues-exit-code: 1

linters:
  enable:
    - testpackage
    - tagliatelle
    - gocritic
    - intrange
    - gosec
    - modernize
    - errorlint # flag err==target / %v-on-error: break on wrapped errors
    - unparam   # unused or always-same function parameters
    - prealloc  # slices grown via append that could be preallocated
    - recvcheck # a type's methods should not mix value/pointer receivers
  exclusions:
    rules:
      # gosec credential/permission checks are expected noise in test and e2e
      # scaffolding: AWS example keys and intentionally-loose perms used to
      # assert rejection. Not shipped code.
      - path: (_test\.go|^e2e/)
        linters:
          - gosec
      # e2e is test scaffolding, not shipped code:
      #  - unparam: helpers legitimately take params that always receive the
      #    same constant (fixed instance names, force=true, …) for readability.
      #  - errorlint: assertion messages use fmt.Errorf("…got: %v", err); they
      #    are not error-wrapping chains, so %w-vs-%v is irrelevant there.
      # Production code is still checked by both.
      - path: ^e2e/
        linters:
          - unparam
          - errorlint
      # operations has internal tests that exercise unexported helpers
      # (quotePostgresLiteral, buildCreateDatabaseSQL, …), so they must live in
      # package operations and testpackage can't apply.
      - path: internal/operations/.*_test\.go
        linters:
          - testpackage
      # reconcile_test.go pins the startup status matrix by calling the
      # unexported decideReconcile directly. The exported entry point takes a
      # *docker.Client, which cannot be faked, so an external test package could
      # not reach the matrix at all — and an untested matrix is precisely how it
      # came to handle four of its ~forty cases.
      - path: internal/daemon/reconcile_test\.go
        linters:
          - testpackage
      # migration020_test.go calls the unexported migration function directly.
      # Going through the exported Store would run every migration at once, so
      # the test could not set up the PRE-020 schema it needs to migrate FROM —
      # and this migration rebuilds the one table holding every instance's
      # encrypted password, so it is the last one to leave untested.
      - path: internal/store/migration020_test\.go
        linters:
          - testpackage
      # backup_dir_resolution_test.go pins the one rule that `oddk daemon` and
      # `oddk snapshot apply` must share when resolving the backup directory.
      # oddkUserBackupDir is deliberately unexported — it is an internal
      # invariant, not API — and the exported paths that consume it are a systemd
      # daemon and a destructive DR command, neither reachable from a unit test.
      # The two defaults silently disagreeing is what stranded applied archives
      # outside the daemon's sweep, so the rule is worth pinning directly.
      - path: internal/cli/backup_dir_resolution_test\.go
        linters:
          - testpackage
      # health_notifications_test.go asserts the degraded notification body by
      # calling the unexported buildDegradedMessage. The exported path needs a
      # live *store.Store for the display name, so an external test package
      # could only reach this formatting through a database — and this is
      # formatting that silently dropped the one line saying WHY an instance was
      # broken, precisely because nothing asserted what the operator receives.
      - path: internal/services/health_notifications_test\.go
        linters:
          - testpackage

# Formatters are a separate subsystem from linters in golangci-lint v2: they are
# applied by `golangci-lint fmt`, NOT `golangci-lint run` (and `run --fix` does
# not format). Run `make fmt` to rewrite files, `make fmt-check` to verify in CI.
formatters:
  enable:
    - gofumpt   # stricter superset of gofmt (also handles EOF newlines, blank-line whitespace)
    - goimports # group/sort imports and add/remove as needed
  settings:
    gofumpt:
      extra-rules: true
    goimports:
      local-prefixes:
        - github.com/andrianbdn/oddk
