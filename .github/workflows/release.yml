name: Release

# Builds linux/amd64 and linux/arm64 binaries and publishes them as a GitHub
# Release. Triggered by pushing a version tag (vX.Y.Z), or manually via the
# Actions tab against an existing tag.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to release (e.g. v0.1.0)'
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Build and package
        run: |
          set -eu
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          VERSION="${TAG#v}"
          mkdir -p dist
          for arch in amd64 arm64; do
            CGO_ENABLED=0 GOOS=linux GOARCH="$arch" \
              go build -buildvcs=true -o "oddk-linux-$arch" ./cmd/oddk
            tar -czf "dist/oddk-linux-$arch.tar.gz" "oddk-linux-$arch"
          done
          # Sanity: the amd64 binary (runnable on this amd64 runner) must report
          # the version we are tagging, catching tag/version.go mismatches.
          built="$(./oddk-linux-amd64 --version 2>&1 || true)"
          case "$built" in
            *"$VERSION"*) echo "version ok: $built" ;;
            *) echo "::error::binary reports '$built' but tag is $TAG"; exit 1 ;;
          esac
          rm -f oddk-linux-amd64 oddk-linux-arm64
          (cd dist && sha256sum *.tar.gz > SHA256SUMS)

      - name: Extract release notes
        run: |
          set -eu
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          # Releases are not cut for every version: several internal versions
          # can ship in one public release. So the body covers every CHANGELOG
          # section from this tag's down to (not including) the PREVIOUS public
          # tag's. Otherwise someone upgrading from that tag never sees the
          # intermediate versions' notes, and least of all their Action: lines,
          # which matter most exactly when several versions land at once.
          # (fetch-depth: 0 above is what makes the previous tag visible.)
          PREV="$(git describe --tags --abbrev=0 --match 'v[0-9]*' "$TAG^" 2>/dev/null || true)"
          echo "release notes: $TAG, since ${PREV:-<no previous tag>}"
          TAG="$TAG" PREV="$PREV" awk -f - CHANGELOG.md > notes.md <<'AWK'
          # Stops at: the previous tag's heading, any non-version heading
          # ("## Earlier releases"), or — with no previous tag — the next
          # heading, which keeps a first release to its own section.
          function is_version(line) { return line ~ /^## v[0-9]+\.[0-9]+\.[0-9]+ / }
          BEGIN { tag = ENVIRON["TAG"]; prev = ENVIRON["PREV"] }
          index($0, "## " tag " ") == 1 { found = 1; own = $0; next }
          !found { next }
          /^## / {
            if (prev == "" || !is_version($0) || index($0, "## " prev " ") == 1) exit
            versions++
          }
          { body = body $0 "\n" }
          END {
            # With intermediate versions, the tag's own section needs its
            # heading too, or its notes read as belonging to the next one.
            if (versions > 0) printf "%s\n", own
            printf "%s", body
          }
          AWK
          # A missing section fails the release, deliberately and for the same
          # reason the version check above does: the recovery is identical
          # (fix the commit, move the tag, re-push), and a release published
          # with placeholder notes is one nobody ever goes back to write.
          if ! grep -q "^## $TAG " CHANGELOG.md || ! grep -q '[^[:space:]]' notes.md; then
            echo "::error::CHANGELOG.md has no section for $TAG (expected a '## $TAG — <date>' heading)"
            exit 1
          fi

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          gh release create "$TAG" \
            --repo "${{ github.repository }}" \
            --title "ODDK $TAG" \
            --notes-file notes.md \
            dist/oddk-linux-amd64.tar.gz \
            dist/oddk-linux-arm64.tar.gz \
            dist/SHA256SUMS
